# DTMS Prometheus configuration.
#
# Scrapes the API /metrics endpoint every 15 s. The API runs on the
# docker network so we use the service DNS name `api` (not localhost).
# Metrics live under the DTMS.* meter families — see PoolMetrics /
# HubMetrics / ProjectionMetrics for the actual metric names.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules. Files are mounted at /etc/prometheus/rules via docker-compose.
# NOTE: no Alertmanager is wired yet, so alerts fire + show in the Prometheus
# UI (/alerts) but are not routed to Slack/email. Add an `alerting:` block +
# an alertmanager container to enable notification delivery.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: dtms-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8080]
        labels:
          service: dtms-api

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Host (Windows) metrics — windows_exporter runs on the Docker host as a
  # user-level scheduled task ("dtms-windows-exporter", D:\dtms-tools; NOT an
  # MSI service — the machine has no admin elevation). host.docker.internal
  # is Docker Desktop's built-in host alias. Drives the C:-disk-full alerts
  # in rules/host-disk.yml (the 2026-07-24 webhook outage was a full C:).
  - job_name: windows-host
    static_configs:
      - targets: [host.docker.internal:9182]
        labels:
          service: windows-host
